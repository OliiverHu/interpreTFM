# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# The API reference is built from the source tree with heavy dependencies mocked
# (see docs/conf.py), so the package itself is not installed here.
python:
  install:
    - requirements: docs/requirements.txt
