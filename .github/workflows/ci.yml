name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    # Pinned image: setup-python provides Python 3.8 and 3.9 builds for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml and the README badge.
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: python -m pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install documentation requirements
        run: python -m pip install --upgrade pip && python -m pip install -r docs/requirements.txt
      - name: Build HTML
        run: sphinx-build -b html --keep-going docs docs/_build/html
