# Documentation build environment (Sphinx). Exported with conda env export --no-builds.
#   conda env create -f envs/docs.yml && conda activate interpretfm-docs
#   sphinx-build -b html docs docs/_build/html
name: interpretfm-docs
channels:
  - conda-forge
  - defaults
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.10.23
  - ld_impl_linux-64=2.46.1
  - libexpat=2.9.0
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libpython=3.11.18
  - libsqlite=3.54.1
  - libuuid=2.42.4
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.5
  - packaging=26.3
  - pip=26.2.2
  - python=3.11.18
  - readline=8.3
  - setuptools=84.2.1
  - tk=8.6.13
  - tzdata=2026e
  - wheel=0.48.0
  - zstd=1.5.7
  - pip:
      - accessible-pygments==0.0.5
      - alabaster==1.0.0
      - babel==2.18.0
      - beautifulsoup4==4.15.0
      - certifi==2026.10.23
      - charset-normalizer==3.5.2
      - docutils==0.22.4
      - furo==2025.12.19
      - idna==3.20
      - imagesize==2.0.1
      - jinja2==3.1.6
      - markdown-it-py==4.2.0
      - markupsafe==3.0.4
      - mdit-py-plugins==0.6.1
      - mdurl==0.1.2
      - myst-parser==5.1.0
      - pygments==2.21.0
      - pyyaml==6.0.3
      - requests==2.34.2
      - roman-numerals==4.1.0
      - snowballstemmer==3.1.1
      - soupsieve==4.0.1
      - sphinx==9.0.4
      - sphinx-basic-ng==1.0.0b2
      - sphinx-copybutton==0.5.2
      - sphinxcontrib-applehelp==2.0.0
      - sphinxcontrib-devhelp==2.0.0
      - sphinxcontrib-htmlhelp==2.1.0
      - sphinxcontrib-jsmath==2.0.0
      - sphinxcontrib-qthelp==2.0.0
      - sphinxcontrib-serializinghtml==2.0.0
      - typing-extensions==4.16.0
      - urllib3==2.8.0
